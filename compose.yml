services:
  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-crawler}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-crawler-password}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    user: "0:0"
    restart: unless-stopped
    environment:
      RUSTFS_ROOT_USER: ${RUSTFS_ACCESS_KEY:-admin}
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_SECRET_KEY:-password}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-admin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-password}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-documents}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    command:
      - server
      - --address
      - ":9000"
      - --console-enable
      - --console-address
      - ":9001"
      - /data
    ports:
      - "8080:9000"
      - "9001:9001"
    volumes:
      - ./data/rustfs:/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    user: "0:0"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    user: "0:0"
    restart: on-failure
    env_file:
      - .env
    volumes:
      - ./data/pdf:/app/data/pdf
    environment:
      CRAWLER_MODE: producer
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-crawler}:${RABBITMQ_PASSWORD:-crawler-password}@rabbitmq:5672/%2F
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-admin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-password}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-documents}
      RUSTFS_PREFIX: ${RUSTFS_PREFIX:-pdf}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rustfs:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  test:
    profiles:
      - test
    build:
      context: .
      dockerfile: Dockerfile
      target: test

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    user: "0:0"
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data/pdf:/app/data/pdf
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-crawler}:${RABBITMQ_PASSWORD:-crawler-password}@rabbitmq:5672/%2F
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-admin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-password}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-documents}
      RUSTFS_PREFIX: ${RUSTFS_PREFIX:-pdf}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    command:
      - celery
      - -A
      - playright_peraturan_bpk.celery_app:app
      - worker
      - --loglevel=INFO
      - --concurrency=${CELERY_CONCURRENCY:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rustfs:
        condition: service_started
      rabbitmq:
        condition: service_healthy
