[project]
name = "playright-peraturan-bpk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nur Wachid", email = "wachid@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "beautifulsoup4>=4.15.0",
    "boto3>=1.40.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "celery>=5.6,<6",
]

[project.scripts]
playright-peraturan-bpk = "playright_peraturan_bpk:main"

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.17.0",
    "types-requests>=2.32.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = [".specify", "migrations/versions"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
    "PIE",
    "ISC",
    "RET",
    "N",
    "TID",
]
ignore = [
    "RUF012", # SQLAlchemy models and test doubles use class-level defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "E501",     # HTML fixtures are kept on single lines for readability
    "PLC0415",  # local imports keep the test module self-contained
]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
ignore_missing_imports = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true

[tool.coverage.run]
source = ["src/playright_peraturan_bpk"]
branch = true

[tool.coverage.report]
show_missing = true

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
