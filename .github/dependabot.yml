version: 2

updates:
  # Python dependencies declared in pyproject.toml and resolved in uv.lock.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: scope
    labels:
      - dependencies
      - python
    groups:
      # Batch routine bumps into one PR to keep the review queue small;
      # major upgrades still arrive on their own.
      python-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # Majors are reviewed manually to avoid surprise breaking changes.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # GitHub Actions used by .github/workflows/ci.yml.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"

  # Base images referenced by the Dockerfile and compose.yml.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    commit-message:
      prefix: "docker"
      include: scope
    labels:
      - dependencies
      - docker
