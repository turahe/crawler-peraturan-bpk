# SonarCloud / SonarQube analysis configuration.
#
# Set sonar.organization and sonar.projectKey to match your SonarCloud
# organization and project before the first CI analysis. The project key
# follows SonarCloud's default <organization>_<repository> convention.

sonar.projectKey=nur-wachid_playright-peraturan-bpk
sonar.organization=nur-wachid
sonar.projectName=playright-peraturan-bpk
sonar.projectVersion=0.1.0

sonar.sourceEncoding=UTF-8
sonar.python.version=3.14

# Analysis scope
sonar.sources=src
sonar.tests=tests
sonar.python.coverage.reportPaths=coverage.xml

# Generated, vendored, and non-source paths are skipped by the scanner.
sonar.exclusions=graphify-out/**,data/**,.specify/**,**/.venv/**,**/__pycache__/**

# Tests and the package entrypoint are exercised indirectly; exclude them from
# coverage scoring so the gate reflects production code.
sonar.coverage.exclusions=tests/**,src/playright_peraturan_bpk/__main__.py
sonar.cpd.exclusions=tests/**
